<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GymBeast — Мій Тренувальний Щоденник</title>
<style>
  :root {
    --bg: #0f0f1a;
    --bg2: #1a1a2e;
    --bg3: #16213e;
    --card: #1e1e35;
    --card2: #252545;
    --accent: #6c63ff;
    --accent2: #a855f7;
    --green: #10b981;
    --orange: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --border: #2d2d50;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow-x: hidden; }
  #root { min-height: 100vh; padding-bottom: 80px; }

  /* NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px; cursor: pointer; border: none; background: none; color: var(--text2); font-size: 10px; transition: color 0.2s; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* HEADER */
  .page-header { padding: 50px 20px 20px; background: linear-gradient(135deg, var(--bg3) 0%, var(--bg2) 100%); }
  .page-header h1 { font-size: 24px; font-weight: 700; }
  .page-header p { color: var(--text2); font-size: 14px; margin-top: 4px; }

  /* CARDS */
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin: 0 16px 12px; border: 1px solid var(--border); }
  .card-title { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

  /* STATS ROW */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 16px 12px; }
  .stat-card { background: var(--card); border-radius: 14px; padding: 14px 10px; text-align: center; border: 1px solid var(--border); }
  .stat-val { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 10px; color: var(--text2); margin-top: 2px; }

  /* LEVEL BAR */
  .xp-bar-wrap { background: var(--bg2); border-radius: 999px; height: 8px; overflow: hidden; margin-top: 8px; }
  .xp-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.5s; }

  /* WORKOUT DAY CARD */
  .day-card { background: var(--card2); border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); cursor: pointer; position: relative; overflow: hidden; }
  .day-card.active-day { border-color: var(--accent); }
  .day-card .day-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .day-card h3 { font-size: 16px; font-weight: 600; }
  .day-card .day-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .day-card.done-day { opacity: 0.7; }
  .done-badge { position: absolute; top: 14px; right: 14px; background: var(--green); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 999px; font-weight: 600; }
  .rest-day-card { background: var(--bg3); border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px dashed var(--border); opacity: 0.6; text-align: center; color: var(--text2); font-size: 14px; }

  /* EXERCISES */
  .exercise-block { margin-bottom: 16px; }
  .block-header { background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  .block-header h4 { font-size: 14px; font-weight: 700; }
  .block-header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .exercise-item { background: var(--bg2); border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); }
  .ex-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .ex-hint { font-size: 11px; color: var(--text2); margin-bottom: 10px; line-height: 1.4; }
  .ex-tag { display: inline-block; background: var(--bg3); border-radius: 6px; padding: 2px 8px; font-size: 10px; color: var(--accent); margin-bottom: 8px; }

  /* SETS TABLE */
  .sets-grid { display: grid; grid-template-columns: auto 1fr 1fr 40px; gap: 6px; align-items: center; }
  .sets-grid .set-label { font-size: 12px; color: var(--text2); }
  .sets-grid .col-header { font-size: 10px; color: var(--text2); text-align: center; }
  .set-input { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px; color: var(--text); font-size: 15px; text-align: center; width: 100%; outline: none; -webkit-appearance: none; }
  .set-input:focus { border-color: var(--accent); }
  .set-done-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
  .set-done-btn.done { background: var(--green); border-color: var(--green); }

  /* CARDIO */
  .cardio-section { background: var(--bg3); border-radius: 12px; padding: 14px; margin: 10px 0; }
  .cardio-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .cardio-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .cardio-opt { border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .cardio-opt.selected { border-color: var(--accent); background: rgba(108,99,255,0.15); }
  .cardio-opt .c-icon { font-size: 20px; margin-bottom: 4px; }
  .cardio-opt .c-label { font-size: 11px; color: var(--text2); }
  .cardio-opt.selected .c-label { color: var(--accent); }

  /* WEIGHT TRACKER */
  .weight-input-row { display: flex; gap: 10px; align-items: center; }
  .big-input { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: var(--text); font-size: 20px; font-weight: 700; text-align: center; outline: none; -webkit-appearance: none; }
  .big-input:focus { border-color: var(--accent); }
  .add-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 12px; padding: 14px 20px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 14px; padding: 16px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 16px; }
  .btn-secondary { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }

  /* CHART */
  .mini-chart { height: 80px; position: relative; margin: 10px 0; }
  .chart-svg { width: 100%; height: 100%; }

  /* HISTORY */
  .history-item { background: var(--card2); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
  .history-date { font-size: 12px; color: var(--text2); }
  .history-day { font-size: 14px; font-weight: 600; }
  .history-stats { text-align: right; font-size: 12px; color: var(--text2); }

  /* ACHIEVEMENTS */
  .achievements-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .achievement { background: var(--card2); border-radius: 14px; padding: 14px; text-align: center; border: 1px solid var(--border); }
  .achievement.unlocked { border-color: var(--gold); background: rgba(251,191,36,0.08); }
  .achievement .ach-icon { font-size: 32px; margin-bottom: 8px; }
  .achievement .ach-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .achievement .ach-desc { font-size: 10px; color: var(--text2); }
  .achievement:not(.unlocked) { opacity: 0.5; filter: grayscale(0.8); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: flex-end; }
  .modal-sheet { background: var(--card); border-radius: 24px 24px 0 0; padding: 20px 20px 40px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 999px; margin: 0 auto 20px; }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

  /* STREAK */
  .streak-display { display: flex; align-items: center; gap: 10px; }
  .streak-fire { font-size: 36px; }
  .streak-num { font-size: 42px; font-weight: 700; line-height: 1; }
  .streak-label { font-size: 14px; color: var(--text2); }

  /* TOAST */
  .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 12px 24px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 300; animation: toast-in 0.3s ease; white-space: nowrap; }
  @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  /* LEVEL BADGE */
  .level-badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, var(--gold), #f97316); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: #000; }

  /* WEEK CALENDAR */
  .week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 16px 12px; }
  .week-day { text-align: center; }
  .week-day .wd-label { font-size: 9px; color: var(--text2); margin-bottom: 4px; }
  .week-day .wd-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 11px; font-weight: 600; }
  .wd-dot.today { background: var(--accent); color: #fff; }
  .wd-dot.done { background: var(--green); color: #fff; }
  .wd-dot.rest { background: var(--bg3); color: var(--text2); }
  .wd-dot.training { background: var(--bg2); color: var(--text); border: 1px dashed var(--accent); }
  .wd-dot.past { background: var(--bg2); color: var(--text2); }

  .section-pad { padding: 0 16px; }
  .mt-8 { margin-top: 8px; }
  .mt-12 { margin-top: 12px; }
  .text-green { color: var(--green); }
  .text-orange { color: var(--orange); }
  .text-accent { color: var(--accent); }
  .text-sm { font-size: 13px; }
  .text-xs { font-size: 11px; color: var(--text2); }
  .fw-600 { font-weight: 600; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill-green { background: rgba(16,185,129,0.2); color: var(--green); }
  .pill-orange { background: rgba(245,158,11,0.2); color: var(--orange); }
  .pill-accent { background: rgba(108,99,255,0.2); color: var(--accent); }

  .tab-row { display: flex; gap: 8px; padding: 0 16px 12px; overflow-x: auto; scrollbar-width: none; }
  .tab-row::-webkit-scrollbar { display: none; }
  .tab-btn { border: 1px solid var(--border); border-radius: 999px; padding: 7px 16px; font-size: 13px; white-space: nowrap; cursor: pointer; background: var(--card); color: var(--text2); }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ─── DATA ─────────────────────────────────────────────────────────────────────

const KEYS = { profile: 'gb_profile', workouts: 'gb_workouts', weights: 'gb_weights', achievements: 'gb_ach' };
const load = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function getInitProfile() {
  return load(KEYS.profile, { xp: 0, streak: 0, lastWorkoutDate: null, totalWorkouts: 0 });
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function today() { return new Date().toISOString().slice(0, 10); }
function todayWeekday() { return new Date().getDay(); }
function formatDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' });
}
function getLevel(xp) {
  let current = LEVELS[0];
  for (const l of LEVELS) { if (xp >= l.minXP) current = l; }
  const idx = LEVELS.indexOf(current);
  const next = LEVELS[idx + 1];
  return { ...current, next, progress: next ? (xp - current.minXP) / (next.minXP - current.minXP) : 1 };
}
function getWeekDates() {
  const now = new Date();
  const day = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d.toISOString().slice(0, 10);
  });
}

// ─── MINI LINE CHART ──────────────────────────────────────────────────────────
function LineChart({ data, color = '#6c63ff' }) {
  if (!data || data.length < 2) return React.createElement('div', { className: 'text-xs', style: { textAlign: 'center', paddingTop: 30 } }, 'Ще недостатньо даних');
  const vals = data.map(d => d.value);
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = max - min || 1;
  const W = 300, H = 70;
  const points = vals.map((v, i) => {
    const x = (i / (vals.length - 1)) * W;
    const y = H - ((v - min) / range) * (H - 10) - 5;
    return `${x},${y}`;
  }).join(' ');
  const areaPoints = `0,${H} ` + points + ` ${W},${H}`;
  return React.createElement('svg', { viewBox: `0 0 ${W} ${H}`, className: 'chart-svg', preserveAspectRatio: 'none' },
    React.createElement('defs', null,
      React.createElement('linearGradient', { id: 'chartGrad', x1: '0', y1: '0', x2: '0', y2: '1' },
        React.createElement('stop', { offset: '0%', stopColor: color, stopOpacity: '0.3' }),
        React.createElement('stop', { offset: '100%', stopColor: color, stopOpacity: '0' })
      )
    ),
    React.createElement('polygon', { points: areaPoints, fill: 'url(#chartGrad)' }),
    React.createElement('polyline', { points, fill: 'none', stroke: color, strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round' }),
    vals.map((v, i) => {
      const x = (i / (vals.length - 1)) * W;
      const y = H - ((v - min) / range) * (H - 10) - 5;
      return React.createElement('circle', { key: i, cx: x, cy: y, r: 3, fill: color });
    })
  );
}

function Toast({ msg, onDone }) {

}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('home');
  const [profile, setProfile] = useState(getInitProfile);
  const [workouts, setWorkouts] = useState(() => load(KEYS.workouts, []));
  const [weights, setWeights] = useState(() => load(KEYS.weights, []));
  const [unlockedAch, setUnlockedAch] = useState(() => load(KEYS.achievements, []));
  const [toast, setToast] = useState(null);
  const [activeWorkout, setActiveWorkout] = useState(null); // { dayId, date, sets: {exId: [{weight,reps,done}]}, cardio, completed }

  const showToast = useCallback((msg) => setToast(msg), []);

  const addXP = useCallback((amount, reason) => {
    setProfile(p => {
      const np = { ...p, xp: (p.xp || 0) + amount };
      save(KEYS.profile, np);
      return np;
    });
    showToast(`+${amount} XP — ${reason}!`);
  }, [showToast]);

  const checkAchievements = useCallback((stats) => {
    setUnlockedAch(prev => {
      const newUnlocked = [];
      for (const a of ACHIEVEMENTS) {
        if (!prev.includes(a.id) && a.condition(stats)) {
          newUnlocked.push(a.id);
        }
      }
      if (newUnlocked.length > 0) {
        const next = [...prev, ...newUnlocked];
        save(KEYS.achievements, next);
        setTimeout(() => showToast(`🏆 Досягнення: ${ACHIEVEMENTS.find(a => a.id === newUnlocked[0])?.name}!`), 1000);
        return next;
      }
      return prev;
    });
  }, [showToast]);

  // Compute stats
  const stats = useMemo(() => {
    const totalWorkouts = workouts.length;
    const weekDates = getWeekDates();
    const weekWorkouts = workouts.filter(w => weekDates.includes(w.date)).length;
    // streak
    let streak = 0;
    const sortedDates = [...new Set(workouts.map(w => w.date))].sort().reverse();
    const t = today();
    let check = new Date(t);
    for (const d of sortedDates) {
      const ds = check.toISOString().slice(0, 10);
      if (d === ds || d === new Date(check.getTime() - 86400000).toISOString().slice(0, 10)) {
        streak++;
        check = new Date(ds);
        check.setDate(check.getDate() - 1);
      } else break;
    }
    // weight lost
    let weightLost = 0;
    if (weights.length >= 2) {
      const first = weights[0].value;
      const last = weights[weights.length - 1].value;
      weightLost = Math.max(0, first - last);
    }
    return { totalWorkouts, weekWorkouts, streak, weightLost };
  }, [workouts, weights]);

  const saveWorkout = useCallback((workout) => {
    const xpGained = 100 + (CARDIO_OPTIONS.find(c => c.id === workout.cardio)?.xp || 0);
    setWorkouts(prev => {
      const next = [...prev.filter(w => !(w.date === workout.date && w.dayId === workout.dayId)), workout];
      save(KEYS.workouts, next);
      return next;
    });
    setProfile(p => {
      const np = { ...p, xp: (p.xp || 0) + xpGained, totalWorkouts: (p.totalWorkouts || 0) + 1, lastWorkoutDate: workout.date };
      save(KEYS.profile, np);
      return np;
    });
    showToast(`✅ Тренування збережено! +${xpGained} XP`);
    setTimeout(() => checkAchievements({ ...stats, totalWorkouts: stats.totalWorkouts + 1 }), 500);
    setActiveWorkout(null);
    setTab('home');
  }, [stats, checkAchievements, showToast]);

  const level = getLevel(profile.xp || 0);
  const weekDates = getWeekDates();
  const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];

  return React.createElement('div', { id: 'app' },
    toast && React.createElement(Toast, { msg: toast, onDone: () => setToast(null) }),
    activeWorkout
      ? React.createElement(WorkoutScreen, { workout: activeWorkout, setWorkout: setActiveWorkout, onSave: saveWorkout, onBack: () => setActiveWorkout(null) })
      : React.createElement('div', null,
          tab === 'home' && React.createElement(HomeTab, { profile, level, stats, workouts, weights, weekDates, dayNames, setActiveWorkout, setTab }),
          tab === 'train' && React.createElement(TrainTab, { workouts, setActiveWorkout }),
          tab === 'progress' && React.createElement(ProgressTab, { weights, setWeights, workouts, addXP }),
          tab === 'achievements' && React.createElement(AchievementsTab, { unlockedAch, stats }),
        ),
    !activeWorkout && React.createElement(BottomNav, { tab, setTab })
  );
}

    if (sets[exId]) return sets[exId];
    return Array.from({ length: 3 }, () => ({ weight: ex.defaultWeight, reps: ex.defaultReps, done: false }));
  };

  const updateSet = (exId, setIdx, field, value) => {
    setSets(prev => {
      const exSets = prev[exId] ? [...prev[exId]] : [];
      exSets[setIdx] = { ...exSets[setIdx], [field]: value };
      return { ...prev, [exId]: exSets };
    });

        React.createElement('div', { key: block.id, className: 'exercise-block' },

            React.createElement('h4', null, block.name),
            React.createElement('p', null, block.desc)
          ),
          block.exercises.map(ex => {
            const exSets = sets[ex.id] || initSetsForExercise(ex.id, ex);
            return React.createElement('div', { key: ex.id, className: 'exercise-item' },
              React.createElement('div', { className: 'ex-tag' }, ex.tag),
              React.createElement('div', { className: 'ex-name' }, ex.name),
              React.createElement('div', { className: 'ex-hint' }, ex.hint),
              // Sets grid header
              React.createElement('div', { className: 'sets-grid', style: { marginBottom: 4 } },
                React.createElement('div', { className: 'col-header' }, 'Підхід'),
                React.createElement('div', { className: 'col-header' }, ex.unit ? `Вага (${ex.unit})` : 'Повтори'),
                React.createElement('div', { className: 'col-header' }, 'Повтори'),
                React.createElement('div', null)
              ),
              exSets.map((s, si) =>
                React.createElement('div', { key: si, className: 'sets-grid', style: { marginBottom: 6 } },
                  React.createElement('div', { className: 'set-label' }, `${si + 1}`),
                  ex.unit
                    ? React.createElement('input', { type: 'number', className: 'set-input', value: s.weight, onChange: e => { updateSet(ex.id, si, 'weight', parseFloat(e.target.value) || 0); } })

                  React.createElement('input', { type: 'number', className: 'set-input', value: s.reps, onChange: e => { updateSet(ex.id, si, 'reps', parseInt(e.target.value) || 0); } }),

                    React.createElement('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: '#fff', strokeWidth: 2.5, width: 16, height: 16 },
                      React.createElement('polyline', { points: '20 6 9 17 4 12' })
                    )
                  )
                )
              ),
              React.createElement('div', { className: 'text-xs', style: { marginTop: 8, color: 'var(--orange)' } }, `⏱ Відпочинок між підходами: ${block.rest} сек`)
            );
          }),
          bi < day.blocks.length - 1 && React.createElement('div', { style: { textAlign: 'center', padding: '8px 0', color: 'var(--text2)', fontSize: 12 } }, '⏳ 2–3 хв відпочинок між блоками')
        )
      ),
      React.createElement('button', { className: 'btn-primary', onClick: () => setPhase('cardio') }, '✅ Вправи виконані — до кардіо!')
    ),

    phase === 'cardio' && React.createElement('div', { style: { padding: '0 16px 16px' } },
      React.createElement('div', { className: 'card', style: { margin: 0 } },
        React.createElement('div', { className: 'card-title' }, `🏃 КАРДІО — ${day.cardio.duration} хвилин`),
        React.createElement('div', { className: 'text-sm', style: { marginBottom: 14 } }, day.cardio.desc),
        React.createElement('div', { className: 'cardio-title' }, 'Оцініть складність:'),
        React.createElement('div', { className: 'cardio-options' },
          CARDIO_OPTIONS.map(opt => React.createElement('div', { key: opt.id, className: `cardio-opt${cardio === opt.id ? ' selected' : ''}`, onClick: () => setCardio(opt.id) },
            React.createElement('div', { className: 'c-icon' }, opt.icon),
            React.createElement('div', { className: 'c-label' }, opt.label),
            React.createElement('div', { style: { fontSize: 9, color: 'var(--text2)', marginTop: 2 } }, `+${opt.xp} XP`)
          ))
        ),
        React.createElement('div', { style: { marginTop: 16, padding: 12, background: 'rgba(59,130,246,0.1)', borderRadius: 12, fontSize: 13, color: 'var(--text2)' } },
          '💊 Після кардіо прийняти 5 г креатину + воду!'
        ),
        React.createElement('button', { className: 'btn-primary', onClick: handleFinish }, '🎉 Тренування завершено! Зберегти')
      )
    )
  );
}

// ─── PROGRESS TAB ─────────────────────────────────────────────────────────────
function ProgressTab({ weights, setWeights, workouts, addXP }) {
  const [newWeight, setNewWeight] = useState('');
  const [histTab, setHistTab] = useState('weight');

  const addWeight = () => {
    const val = parseFloat(newWeight);
    if (!val || val < 40 || val > 300) return;
    const entry = { date: today(), value: val };
    setWeights(prev => {
      const next = [...prev, entry];
      save(KEYS.weights, next);
      return next;
    });
    setNewWeight('');
    if (weights.length === 0) addXP(50, 'Перший запис ваги');
  };

  const lastWeight = weights.length > 0 ? weights[weights.length - 1].value : null;
  const startWeight = weights.length > 0 ? weights[0].value : null;
  const diff = startWeight && lastWeight ? (lastWeight - startWeight) : null;
  const recentWeights = weights.slice(-20);

  return React.createElement('div', null,
    React.createElement('div', { className: 'page-header' },
      React.createElement('h1', null, '📊 Прогрес'),
      React.createElement('p', null, 'Відстежуй свій шлях до мети')
    ),

    // Weight input
    React.createElement('div', { className: 'card' },
      React.createElement('div', { className: 'card-title' }, '⚖️ Моя вага'),
      React.createElement('div', { className: 'weight-input-row' },
        React.createElement('input', { type: 'number', className: 'big-input', placeholder: 'кг', value: newWeight, onChange: e => setNewWeight(e.target.value), step: '0.1' }),
        React.createElement('button', { className: 'add-btn', onClick: addWeight }, '+ Додати')
      ),
      lastWeight && React.createElement('div', { style: { marginTop: 12, display: 'flex', gap: 16 } },
        React.createElement('div', null,
          React.createElement('div', { className: 'text-xs' }, 'Зараз'),
          React.createElement('div', { style: { fontSize: 22, fontWeight: 700 } }, `${lastWeight} кг`)
        ),
        startWeight && diff !== null && React.createElement('div', null,
          React.createElement('div', { className: 'text-xs' }, 'Зміна'),
          React.createElement('div', { style: { fontSize: 22, fontWeight: 700, color: diff < 0 ? 'var(--green)' : diff > 0 ? 'var(--red)' : 'var(--text)' } }, `${diff > 0 ? '+' : ''}${diff.toFixed(1)} кг`)
        )
      )
    ),

    // Weight chart
    weights.length >= 2 && React.createElement('div', { className: 'card' },
      React.createElement('div', { className: 'card-title' }, '📈 Графік ваги'),
      React.createElement('div', { className: 'mini-chart' },
        React.createElement(LineChart, { data: recentWeights, color: '#6c63ff' })
      ),
      React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 11, color: 'var(--text2)', marginTop: 4 } },
        React.createElement('span', null, formatDate(recentWeights[0].date)),
        React.createElement('span', null, formatDate(recentWeights[recentWeights.length - 1].date))
      )
    ),

    // History tabs
    React.createElement('div', { className: 'card' },
      React.createElement('div', { className: 'card-title' }, '📋 Історія'),
      React.createElement('div', { style: { display: 'flex', gap: 8, marginBottom: 12 } },
        React.createElement('button', { className: `tab-btn${histTab === 'weight' ? ' active' : ''}`, onClick: () => setHistTab('weight') }, '⚖️ Вага'),
        React.createElement('button', { className: `tab-btn${histTab === 'workouts' ? ' active' : ''}`, onClick: () => setHistTab('workouts') }, '💪 Тренування')
      ),
      histTab === 'weight'
        ? React.createElement('div', null,
            weights.length === 0
              ? React.createElement('div', { className: 'text-xs', style: { textAlign: 'center', padding: 20 } }, 'Ще немає записів ваги. Внеси свою вагу вище!')
              : [...weights].reverse().slice(0, 15).map((w, i) =>
                  React.createElement('div', { key: i, className: 'history-item' },
                    React.createElement('div', null,
                      React.createElement('div', { className: 'history-date' }, formatDate(w.date)),
                      React.createElement('div', { className: 'history-day' }, `${w.value} кг`)
                    ),
                    i < weights.length - 1 && React.createElement('div', { className: 'history-stats' },
                      (() => {
                        const prev = [...weights].reverse()[i + 1];
                        const d = w.value - prev.value;
                        return React.createElement('span', { style: { color: d < 0 ? 'var(--green)' : d > 0 ? 'var(--red)' : 'var(--text2)' } }, `${d > 0 ? '+' : ''}${d.toFixed(1)} кг`);
                      })()
                    )
                  )
                )
          )
        : React.createElement('div', null,
            workouts.length === 0
              ? React.createElement('div', { className: 'text-xs', style: { textAlign: 'center', padding: 20 } }, 'Ще немає записаних тренувань. Розпочни своє перше!')
              : [...workouts].reverse().slice(0, 20).map((w, i) => {
                  const d = TRAINING_DAYS[w.dayId];
                  if (!d) return null;
                  const totalSets = Object.values(w.sets || {}).reduce((a, s) => a + s.filter(x => x.done).length, 0);
                  return React.createElement('div', { key: i, className: 'history-item' },
                    React.createElement('div', null,
                      React.createElement('div', { className: 'history-date' }, formatDate(w.date)),
                      React.createElement('div', { className: 'history-day' }, `${d.emoji} ${d.title}`)
                    ),
                    React.createElement('div', { className: 'history-stats' },
                      React.createElement('div', null, `${totalSets} підходів`),
                      React.createElement('div', { style: { color: 'var(--accent)' } }, w.cardio || '')
                    )
                  );
                })
          )
    )
  );
}

// ─── ACHIEVEMENTS TAB ─────────────────────────────────────────────────────────
function AchievementsTab({ unlockedAch, stats }) {
  const unlocked = ACHIEVEMENTS.filter(a => unlockedAch.includes(a.id));
  return React.createElement('div', null,
    React.createElement('div', { className: 'page-header' },
      React.createElement('h1', null, '🏆 Досягнення'),
      React.createElement('p', null, `Розблоковано ${unlocked.length} з ${ACHIEVEMENTS.length}`)
    ),
    React.createElement('div', { className: 'card' },
      React.createElement('div', { className: 'streak-display' },
        React.createElement('div', { className: 'streak-fire' }, '🔥'),
        React.createElement('div', null,
          React.createElement('div', { className: 'streak-num' }, stats.streak),
          React.createElement('div', { className: 'streak-label' }, 'днів поспіль')
        ),
        React.createElement('div', { style: { marginLeft: 'auto', textAlign: 'right' } },
          React.createElement('div', { className: 'text-xs' }, 'Цього тижня'),
          React.createElement('div', { style: { fontSize: 22, fontWeight: 700, color: 'var(--green)' } }, `${stats.weekWorkouts}/4`)
        )
      )
    ),
    React.createElement('div', { style: { padding: '0 16px 16px' } },
      React.createElement('div', { className: 'achievements-grid' },
        ACHIEVEMENTS.map(a => {
          const isUnlocked = unlockedAch.includes(a.id);
          return React.createElement('div', { key: a.id, className: `achievement${isUnlocked ? ' unlocked' : ''}` },
            React.createElement('div', { className: 'ach-icon' }, a.icon),
            React.createElement('div', { className: 'ach-name' }, a.name),
            React.createElement('div', { className: 'ach-desc' }, a.desc),
            isUnlocked && React.createElement('div', { style: { marginTop: 6, fontSize: 10, color: 'var(--gold)', fontWeight: 600 } }, '✓ Розблоковано')
          );
        })
      )
    )
  );
}
