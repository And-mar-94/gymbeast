<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GymBeast</title>
<style>
:root{--bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;--card:#1e1e35;--card2:#252545;--accent:#6c63ff;--accent2:#a855f7;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--blue:#3b82f6;--text:#e2e8f0;--text2:#94a3b8;--border:#2d2d50;--gold:#fbbf24;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow-x:hidden;}
#root{min-height:100vh;padding-bottom:80px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;cursor:pointer;border:none;background:none;color:var(--text2);font-size:10px;transition:color 0.2s;}
.nav-btn.active{color:var(--accent);}
.nav-btn svg{width:22px;height:22px;}
.page-header{padding:50px 20px 20px;background:linear-gradient(135deg,var(--bg3) 0%,var(--bg2) 100%);}
.page-header h1{font-size:24px;font-weight:700;}
.page-header p{color:var(--text2);font-size:14px;margin-top:4px;}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 16px 12px;border:1px solid var(--border);}
.card-title{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px 12px;}
.stat-card{background:var(--card);border-radius:14px;padding:14px 10px;text-align:center;border:1px solid var(--border);}
.stat-val{font-size:22px;font-weight:700;color:var(--accent);}
.stat-label{font-size:10px;color:var(--text2);margin-top:2px;}
.xp-bar-wrap{background:var(--bg2);border-radius:999px;height:8px;overflow:hidden;margin-top:8px;}
.xp-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.5s;}
.day-card{background:var(--card2);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;}
.day-card h3{font-size:16px;font-weight:600;}
.day-card .day-sub{font-size:12px;color:var(--text2);margin-top:4px;}
.exercise-block{margin-bottom:16px;}
.block-header{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
.block-header h4{font-size:14px;font-weight:700;}
.block-header p{font-size:11px;opacity:0.85;margin-top:2px;}
.exercise-item{background:var(--bg2);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--border);}
.ex-name{font-size:14px;font-weight:600;margin-bottom:4px;}
.ex-hint{font-size:11px;color:var(--text2);margin-bottom:10px;line-height:1.4;}
.ex-tag{display:inline-block;background:var(--bg3);border-radius:6px;padding:2px 8px;font-size:10px;color:var(--accent);margin-bottom:8px;}
.sets-grid{display:grid;grid-template-columns:auto 1fr 1fr 40px;gap:6px;align-items:center;}
.set-label{font-size:12px;color:var(--text2);}
.col-header{font-size:10px;color:var(--text2);text-align:center;}
.set-input{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:15px;text-align:center;width:100%;outline:none;-webkit-appearance:none;}
.set-input:focus{border-color:var(--accent);}
.set-done-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;}
.set-done-btn.done{background:var(--green);border-color:var(--green);}
.cardio-options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.cardio-opt{border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:all 0.2s;}
.cardio-opt.selected{border-color:var(--accent);background:rgba(108,99,255,0.15);}
.cardio-opt .c-icon{font-size:20px;margin-bottom:4px;}
.cardio-opt .c-label{font-size:11px;color:var(--text2);}
.cardio-opt.selected .c-label{color:var(--accent);}
.weight-input-row{display:flex;gap:10px;align-items:center;}
.big-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:20px;font-weight:700;text-align:center;outline:none;-webkit-appearance:none;}
.big-input:focus{border-color:var(--accent);}
.add-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;padding:14px 20px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;padding:16px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:16px;}
.btn-secondary{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;width:100%;}
.mini-chart{height:80px;position:relative;margin:10px 0;}
.chart-svg{width:100%;height:100%;}
.history-item{background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);}
.history-date{font-size:12px;color:var(--text2);}
.history-day{font-size:14px;font-weight:600;}
.history-stats{text-align:right;font-size:12px;color:var(--text2);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;align-items:flex-end;}
.modal-sheet{background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px 40px;width:100%;max-height:90vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:999px;margin:0 auto 20px;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;}
.level-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--gold),#f97316);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:#000;}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 16px 12px;}
.week-day{text-align:center;}
.week-day .wd-label{font-size:9px;color:var(--text2);margin-bottom:4px;}
.week-day .wd-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:11px;font-weight:600;}
.wd-dot.today{background:var(--accent);color:#fff;}
.wd-dot.done{background:var(--green);color:#fff;}
.wd-dot.rest{background:var(--bg3);color:var(--text2);}
.wd-dot.past{background:var(--bg2);color:var(--text2);}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:600;z-index:300;animation:toast-in 0.3s ease;white-space:nowrap;}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(-10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;}
.pill-green{background:rgba(16,185,129,0.2);color:var(--green);}
.pill-orange{background:rgba(245,158,11,0.2);color:var(--orange);}
.pill-accent{background:rgba(108,99,255,0.2);color:var(--accent);}
.pill-red{background:rgba(239,68,68,0.2);color:var(--red);}
.tab-row{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;}
.tab-row::-webkit-scrollbar{display:none;}
.tab-btn{border:1px solid var(--border);border-radius:999px;padding:7px 16px;font-size:13px;white-space:nowrap;cursor:pointer;background:var(--card);color:var(--text2);}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.text-xs{font-size:11px;color:var(--text2);}
.text-sm{font-size:13px;}
.text-green{color:var(--green);}
.text-accent{color:var(--accent);}
.fw-700{font-weight:700;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 16px;}
.cal-hdr{font-size:10px;color:var(--text2);text-align:center;padding:4px 0;}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:12px;background:var(--bg2);}
.cal-day.empty{background:transparent;cursor:default;}
.cal-day.today{background:var(--accent);color:#fff;font-weight:700;}
.cal-day.has-workout{background:rgba(16,185,129,0.25);border:1px solid rgba(16,185,129,0.5);color:var(--green);font-weight:600;}
.cal-day.other-month{opacity:0.3;}
.cal-day .cal-dot{width:4px;height:4px;border-radius:50%;background:var(--green);position:absolute;bottom:3px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;}
.cal-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 16px;cursor:pointer;font-size:16px;}
.cal-nav span{font-size:16px;font-weight:700;}

/* SCORE BADGE */
.score-badge{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;flex-shrink:0;}
.score-s{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;}
.score-a{background:linear-gradient(135deg,#6c63ff,#a855f7);color:#fff;}
.score-b{background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;}
.score-c{background:linear-gradient(135deg,#94a3b8,#64748b);color:#fff;}

/* MUSCLE DIAGRAM */
.muscle-wrap{display:flex;gap:8px;justify-content:center;margin:10px 0;}
.muscle-svg-box{display:flex;flex-direction:column;align-items:center;gap:4px;}
.muscle-svg-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;}
.muscle-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.muscle-tag-primary{background:rgba(108,99,255,0.25);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:600;}
.muscle-tag-secondary{background:rgba(148,163,184,0.15);color:var(--text2);border-radius:6px;padding:2px 8px;font-size:10px;}

/* WORKOUT DETAIL */
.wk-detail-set{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);}
.wk-detail-set:last-child{border:none;}
.set-num{width:22px;height:22px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text2);flex-shrink:0;}
.set-num.done{background:var(--green);color:#fff;}

/* QUOTE CARD */
.quote-card{background:linear-gradient(135deg,rgba(108,99,255,0.15),rgba(168,85,247,0.15));border:1px solid rgba(108,99,255,0.3);border-radius:16px;padding:16px;margin:0 16px 12px;}
.quote-text{font-size:14px;font-style:italic;line-height:1.6;color:var(--text);}
.quote-author{font-size:11px;color:var(--accent);margin-top:8px;font-weight:600;}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ach-item{background:var(--card2);border-radius:14px;padding:14px;text-align:center;border:1px solid var(--border);}
.ach-item.unlocked{border-color:var(--gold);background:rgba(251,191,36,0.08);}
.ach-item:not(.unlocked){opacity:0.45;filter:grayscale(0.8);}
.ach-icon{font-size:30px;margin-bottom:6px;}
.ach-name{font-size:12px;font-weight:600;margin-bottom:3px;}
.ach-desc{font-size:10px;color:var(--text2);}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback,useMemo,useRef} = React;

// ── QUOTES ──────────────────────────────────────────────────────────────────
const QUOTES = [
  {text:"Біль тимчасовий. Відмова залишається назавжди.",author:"Lance Armstrong"},
  {text:"Якщо ти не зупиняєшся коли втомлений — зупиняйся коли зробив.",author:"David Goggins"},
  {text:"Я робив те, що інші вважали неможливим.",author:"Arnold Schwarzenegger"},
  {text:"Не рахуй дні — роби так, щоб дні рахувались.",author:"Muhammad Ali"},
  {text:"Тіло досягає того, що розум вірить.",author:"Napoleon Hill"},
  {text:"Одного дня або день перший. Ти вибираєш.",author:"Невідомо"},
  {text:"Немає ліфта до успіху. Треба йти сходами.",author:"Zig Ziglar"},
  {text:"Кожне тренування, яке ти не пропустив — це день, коли ти переміг себе.",author:"Ronnie Coleman"},
  {text:"Успіх — це сума маленьких зусиль, повторюваних день за днем.",author:"Robert Collier"},
  {text:"Я не змагаюсь з іншими. Я змагаюсь з тим, ким я був учора.",author:"Kobe Bryant"},
  {text:"Ніхто не запам'ятає твоє тіло. Всі запам'ятають твій характер. Але твоє тіло — це твій характер.",author:"Greg Plitt"},
  {text:"Якщо не виклик — немає змін. Якщо немає змін — немає росту.",author:"Les Brown"},
  {text:"Жоден м'яз не росте без опору. Ні в залі, ні в житті.",author:"Eric Thomas"},
  {text:"Тренування — це не покарання за їжу. Це святкування того, що твоє тіло здатне робити.",author:"Невідомо"},
  {text:"Коли болить — ти зростаєш. Коли не болить — ти деградуєш.",author:"Dorian Yates"},
  {text:"Всі хочуть бути чемпіоном, але ніхто не хоче підіймати важку штангу.",author:"Ronnie Coleman"},
  {text:"Зупинись лише тоді, коли пишаєшся. Не тоді, коли втомився.",author:"Невідомо"},
  {text:"Перші 3 дні — найважчі. Потім стає звичкою. Потім стає частиною тебе.",author:"Mike Tyson"},
];

// ── TRAINING DATA ────────────────────────────────────────────────────────────
const TRAINING_DAYS = {
  1:{name:'День 1',title:'Груди + Спина',subtitle:'Товщина • Горизонтальна площина',emoji:'💪',
    warmup:'7 хв ходьба на доріжці під нахилом 4–6% (5–5.5 км/год)\n3 хв суглобова гімнастика плечей, ліктів, кистей',
    blocks:[
      {id:'b1d1',name:'БЛОК №1 — Горизонтальна площина',desc:'Суперсет антагоністи • 3 підходи • відпочинок 90 сек',rest:90,
        exercises:[
          {id:'e1',name:'Жим штанги лежачи',hint:'Горизонтальна лава. Лопатки зведені та притиснуті до лави. Ноги на підлозі. Опускати до торкання грудей.',tag:'Груди • Базова',dw:45,dr:10,unit:'кг',muscles:{primary:['chest'],secondary:['front_delt','triceps'],view:'front'}},
          {id:'e2',name:'Тяга гантелі в нахилі (1 рука)',hint:'Впираємось коліном і рукою в лаву. Тягнемо до пояса без повороту корпусу. 10 разів кожною рукою.',tag:'Спина • Базова',dw:15,dr:10,unit:'кг',muscles:{primary:['lats','rear_delt'],secondary:['biceps'],view:'back'}},
        ]},
      {id:'b2d1',name:'БЛОК №2 — Вертикальна площина',desc:'Суперсет антагоністи • 3 підходи • відпочинок 90 сек',rest:90,
        exercises:[
          {id:'e3',name:'Тяга вертикального блока до грудей',hint:'Широкий хват. Тягнемо лопатки вниз і назад. Спина злегка відхиляється. Не розгойдуватись.',tag:'Спина • Ширина',dw:37,dr:10,unit:'кг',muscles:{primary:['lats'],secondary:['biceps','rear_delt'],view:'back'}},
          {id:'e4',name:'Жим гантелей під кутом 30°',hint:'Нахил лави 30°. Гантелі у верхній точці майже торкаються. Повільно вниз 3 секунди.',tag:'Верх грудей',dw:13,dr:10,unit:'кг',muscles:{primary:['upper_chest'],secondary:['front_delt','triceps'],view:'front'}},
        ]},
      {id:'b3d1',name:'ПРЕС',desc:'3 підходи по 15–20 повторень • відпочинок 60 сек',rest:60,
        exercises:[
          {id:'e5',name:'Скручування лежачи',hint:'Руки за головою — не тягти за шию! Скручуємо ГРУДЬМИ до колін. Поперек притиснутий до підлоги.',tag:'Прес',dw:0,dr:15,unit:'',muscles:{primary:['abs'],secondary:['obliques'],view:'front'}},
        ]},
    ],
    cardio:{duration:25,desc:'Спокійна ходьба на доріжці після силової'}},

  2:{name:'День 2',title:'Ноги',subtitle:'Квадрицепс + Біцепс стегна',emoji:'🦵',
    warmup:'7 хв орбітрек (еліпс) з помірним опором\n3 хв ретельна розминка колінних та тазостегнових суглобів',
    blocks:[
      {id:'b1d2',name:'БЛОК №1 — Основний',desc:'Суперсет • 3 підходи • відпочинок 90 сек',rest:90,
        exercises:[
          {id:'e6',name:'Жим ногами в платформі',hint:'Стопи на ширині плечей. Коліна не зводити всередину! Поки уникаємо присідань зі штангою — щадимо поперек.',tag:'Квадрицепс • Базова',dw:90,dr:10,unit:'кг',muscles:{primary:['quads'],secondary:['glutes'],view:'front'}},
          {id:'e7',name:'Румунська тяга з гантелями',hint:'ПОВІЛЬНО 3-4 сек вниз. Спина пряма, гантелі ковзають вздовж ніг. Відчуваємо розтягнення задньої поверхні стегна.',tag:'Задня поверхня стегна',dw:15,dr:10,unit:'кг',muscles:{primary:['hamstrings','glutes'],secondary:['lower_back'],view:'back'}},
        ]},
      {id:'b2d2',name:'БЛОК №2 — Гомілки',desc:'3 підходи по 15–20 повторень • відпочинок 60 сек',rest:60,
        exercises:[
          {id:'e8',name:'Підйоми на носки',hint:'Повне розтягнення ікри внизу — пауза 1 сек. У тренажері або на сходинці. Ікри люблять повільний темп.',tag:'Гомілка',dw:10,dr:15,unit:'кг',muscles:{primary:['calves'],secondary:[],view:'back'}},
        ]},
    ],
    cardio:{duration:25,desc:'Ходьба на доріжці без нахилу — відновлення пульсу'}},

  3:{name:'День 3',title:'Плечі + Спина',subtitle:'Дельти + Ширина спини',emoji:'🏋️',
    warmup:'7 хв ходьба + 3 хв активний розігрів плечових суглобів (махи руками, обертання)',
    blocks:[
      {id:'b1d3',name:'БЛОК №1 — Дельти + Верх спини',desc:'Суперсет • 3 підходи • відпочинок 90 сек',rest:90,

const todayStr=()=>new Date().toISOString().slice(0,10);
const fmtDate=iso=>{const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('uk-UA',{day:'numeric',month:'short'});};
const fmtDateFull=iso=>{const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});};
function getLevel(xp){
  let cur=LEVELS[0];
  for(const l of LEVELS)if(xp>=l.minXP)cur=l;
  const idx=LEVELS.indexOf(cur);
  const nxt=LEVELS[idx+1];
  return{...cur,next:nxt,progress:nxt?(xp-cur.minXP)/(nxt.minXP-cur.minXP):1};
}
function calcScore(workout){
  const day=TRAINING_DAYS[workout.dayId];if(!day)return 0;
  const allEx=day.blocks.flatMap(b=>b.exercises);
  const totalSets=allEx.length*3;
  let done=0;
  for(const ex of allEx){
    const sets=workout.sets?.[ex.id]||[];
    done+=sets.filter(s=>s.done).length;
  }
  const setsScore=(done/totalSets)*50;
  const cardioScore={easy:15,medium:25,hard:35}[workout.cardio]||15;
  const bonus=done>=totalSets?15:0;
  return Math.min(100,Math.round(setsScore+cardioScore+bonus));
}
function scoreGrade(s){
  if(s>=90)return{g:'S',cls:'score-s'};
  if(s>=75)return{g:'A',cls:'score-a'};
  if(s>=60)return{g:'B',cls:'score-b'};
  return{g:'C',cls:'score-c'};
}
function calcVolume(workout){
  let vol=0;
  for(const sets of Object.values(workout.sets||{})){
    for(const s of sets){if(s.done&&s.weight>0)vol+=s.weight*s.reps;}
  }
  return vol;
}
function getWeekDates(){
  const now=new Date();const day=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-(day===0?6:day-1));
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.toISOString().slice(0,10);});
}

// ── LINE CHART ────────────────────────────────────────────────────────────────
function LineChart({data,color='#6c63ff'}){
  if(!data||data.length<2)return React.createElement('div',{className:'text-xs',style:{textAlign:'center',paddingTop:28}},'Ще недостатньо даних');
  const vals=data.map(d=>d.value);
  const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
  const W=300,H=70;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*W},${H-((v-min)/range)*(H-10)-5}`).join(' ');
  return React.createElement('svg',{viewBox:`0 0 ${W} ${H}`,className:'chart-svg',preserveAspectRatio:'none'},
    React.createElement('defs',null,React.createElement('linearGradient',{id:'cg',x1:'0',y1:'0',x2:'0',y2:'1'},React.createElement('stop',{offset:'0%',stopColor:color,stopOpacity:'0.3'}),React.createElement('stop',{offset:'100%',stopColor:color,stopOpacity:'0'}))),
    React.createElement('polygon',{points:`0,${H} ${pts} ${W},${H}`,fill:'url(#cg)'}),
    React.createElement('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:'2',strokeLinecap:'round',strokeLinejoin:'round'}),
    vals.map((v,i)=>{const x=(i/(vals.length-1))*W,y=H-((v-min)/range)*(H-10)-5;return React.createElement('circle',{key:i,cx:x,cy:y,r:3,fill:color});})
  );
}

    for(const d of dates){
      const ds=check.toISOString().slice(0,10);
      if(d===ds||d===new Date(check.getTime()-86400000).toISOString().slice(0,10)){streak++;check=new Date(ds);check.setDate(check.getDate()-1);}
      else break;
    }
    let lost=0;
    if(weights.length>=2)lost=Math.max(0,weights[0].value-weights[weights.length-1].value);
    const hasS=workouts.some(w=>calcScore(w)>=90);
    return{total,week,streak,lost,hasS};
  },[workouts,weights]);

  const checkAch=useCallback((newStats)=>{
    setUnlockedAch(prev=>{
      const added=[];
      for(const a of ACHIEVEMENTS)if(!prev.includes(a.id)&&a.c(newStats))added.push(a.id);
      if(added.length){
        const next=[...prev,...added];
        LS.save('gb_ach',next);
        setTimeout(()=>showToast(`🏆 ${ACHIEVEMENTS.find(a=>a.id===added[0])?.name}!`),800);
        return next;
      }
      return prev;
    });
  },[showToast]);

  const saveWorkout=useCallback(workout=>{
    const score=calcScore(workout);
    const xp=80+(CARDIO_OPTIONS.find(c=>c.id===workout.cardio)?.xp||15)+Math.round(score/5);
    const newWorkouts=workouts.filter(w=>!(w.date===workout.date&&w.dayId===workout.dayId));
    newWorkouts.push({...workout,score,volume:calcVolume(workout)});
    setWorkouts(newWorkouts);
    LS.save('gb_workouts',newWorkouts);
    const np={...profile,xp:(profile.xp||0)+xp,totalWorkouts:(profile.totalWorkouts||0)+1};
    setProfile(np);LS.save('gb_profile',np);
    showToast(`✅ Збережено! +${xp} XP • Оцінка: ${scoreGrade(score).g}`);
    setTimeout(()=>checkAch({...stats,total:stats.total+1,hasS:stats.hasS||(score>=90)}),600);
    setActiveWorkout(null);setTab('home');
  },[workouts,profile,stats,checkAch,showToast]);

  const level=getLevel(profile.xp||0);

  return React.createElement('div',null,
    toast&&React.createElement(Toast,{msg:toast,onDone:()=>setToast(null)}),
    calDetail&&React.createElement(WorkoutDetailModal,{workout:calDetail,onClose:()=>setCalDetail(null)}),
    activeWorkout
      ?React.createElement(WorkoutScreen,{workout:activeWorkout,onSave:saveWorkout,onBack:()=>setActiveWorkout(null)})
      :React.createElement('div',null,
          tab==='home'&&React.createElement(HomeTab,{profile,level,stats,workouts,weights,setActiveWorkout,setTab}),
          tab==='train'&&React.createElement(TrainTab,{workouts,setActiveWorkout}),
          tab==='calendar'&&React.createElement(CalendarTab,{workouts,onSelect:setCalDetail}),
          tab==='progress'&&React.createElement(ProgressTab,{weights,setWeights,workouts,showToast,profile,unlockedAch,stats}),
        ),
    !activeWorkout&&React.createElement(BottomNav,{tab,setTab})
  );
}

// ── PROGRESS TAB ──────────────────────────────────────────────────────────────
function ProgressTab({weights,setWeights,workouts,showToast,profile,unlockedAch,stats}){
  const [newWeight,setNewWeight]=useState('');
  const [view,setView]=useState('weight');

  const addWeight=()=>{
    const v=parseFloat(newWeight);
    if(!v||v<30||v>400)return;
    const entry={date:todayStr(),value:v};
    const next=[...weights,entry];
    setWeights(next);LS.save('gb_weights',next);
    setNewWeight('');
    if(weights.length===0)showToast('+50 XP — перший запис ваги!');
  };

  const lastW=weights.length>0?weights[weights.length-1].value:null;
  const startW=weights.length>0?weights[0].value:null;
  const diff=startW&&lastW?(lastW-startW):null;
  const recent=weights.slice(-20);

  const scores=workouts.map(w=>({date:w.date,value:w.score||calcScore(w)})).slice(-20);

  return React.createElement('div',null,
    React.createElement('div',{className:'page-header'},
      React.createElement('h1',null,'📊 Прогрес'),
      React.createElement('p',null,'Відстежуй свій шлях')
    ),

    React.createElement('div',{className:'tab-row',style:{paddingTop:12}},
      [{id:'weight',l:'⚖️ Вага'},{id:'scores',l:'⭐ Оцінки'},{id:'ach',l:'🏆 Нагороди'}]
        .map(t=>React.createElement('button',{key:t.id,className:`tab-btn${view===t.id?' active':''}`,onClick:()=>setView(t.id)},t.l))
    ),

    view==='weight'&&React.createElement('div',null,
      React.createElement('div',{className:'card'},
        React.createElement('div',{className:'card-title'},'⚖️ Моя вага'),
        React.createElement('div',{className:'weight-input-row'},
          React.createElement('input',{type:'number',className:'big-input',placeholder:'кг',value:newWeight,onChange:e=>setNewWeight(e.target.value),step:'0.1'}),
          React.createElement('button',{className:'add-btn',onClick:addWeight},'+ Додати')
        ),
        lastW&&React.createElement('div',{style:{marginTop:12,display:'flex',gap:20,flexWrap:'wrap'}},
          React.createElement('div',null,React.createElement('div',{className:'text-xs'},'Зараз'),React.createElement('div',{style:{fontSize:22,fontWeight:700}},`${lastW} кг`)),
          startW&&diff!==null&&React.createElement('div',null,React.createElement('div',{className:'text-xs'},'Зміна'),React.createElement('div',{style:{fontSize:22,fontWeight:700,color:diff<0?'var(--green)':diff>0?'var(--red)':'var(--text)'}},`${diff>0?'+':''}${diff.toFixed(1)} кг`)),
          startW&&React.createElement('div',null,React.createElement('div',{className:'text-xs'},'Старт'),React.createElement('div',{style:{fontSize:22,fontWeight:700,color:'var(--text2)'}},`${startW} кг`))
        )
      ),
      weights.length>=2&&React.createElement('div',{className:'card'},
        React.createElement('div',{className:'card-title'},'📈 Графік ваги'),
        React.createElement('div',{className:'mini-chart'},React.createElement(LineChart,{data:recent,color:'#6c63ff'})),
        React.createElement('div',{style:{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text2)',marginTop:4}},
          React.createElement('span',null,fmtDate(recent[0].date)),
          React.createElement('span',null,fmtDate(recent[recent.length-1].date))
        )
      ),
      React.createElement('div',{className:'card'},
        React.createElement('div',{className:'card-title'},'📋 Історія ваги'),
        weights.length===0
          ?React.createElement('div',{className:'text-xs',style:{textAlign:'center',padding:20}},'Ще немає записів. Внеси свою вагу вище!')
          :[...weights].reverse().slice(0,20).map((w,i,arr)=>{
              const prev=arr[i+1];
              const d=prev?(w.value-prev.value):null;
              return React.createElement('div',{key:i,className:'history-item'},
                React.createElement('div',null,React.createElement('div',{className:'history-date'},fmtDate(w.date)),React.createElement('div',{className:'history-day'},`${w.value} кг`)),
                d!==null&&React.createElement('span',{style:{color:d<0?'var(--green)':d>0?'var(--red)':'var(--text2)',fontWeight:600,fontSize:13}},`${d>0?'+':''}${d.toFixed(1)} кг`)
              );
            })
      )
    ),

    view==='scores'&&React.createElement('div',null,
      scores.length>=2&&React.createElement('div',{className:'card'},
        React.createElement('div',{className:'card-title'},'⭐ Динаміка оцінок'),
        React.createElement('div',{className:'mini-chart'},React.createElement(LineChart,{data:scores,color:'#fbbf24'}))
      ),
      React.createElement('div',{className:'card'},
        React.createElement('div',{className:'card-title'},'Всі тренування'),
        workouts.length===0
          ?React.createElement('div',{className:'text-xs',style:{textAlign:'center',padding:20}},'Ще немає тренувань')
          :[...workouts].reverse().slice(0,30).map((w,i)=>{
              const d=TRAINING_DAYS[w.dayId];if(!d)return null;
              const score=w.score||calcScore(w);
              const gr=scoreGrade(score);
              return React.createElement('div',{key:i,className:'history-item'},
                React.createElement('div',null,React.createElement('div',{className:'history-date'},fmtDate(w.date)),React.createElement('div',{className:'history-day'},`${d.emoji} ${d.title}`)),
                React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8}},
                  React.createElement('div',{className:'history-stats'},React.createElement('div',null,`${w.volume||0} кг`)),
                  React.createElement('div',{className:`score-badge ${gr.cls}`,style:{width:36,height:36,fontSize:14}},gr.g)
                )
              );
            })
      )
    ),

    view==='ach'&&React.createElement('div',null,
      React.createElement('div',{className:'card'},
        React.createElement('div',{className:'flex-between'},
          React.createElement('div',null,
            React.createElement('div',{className:'card-title'},'🔥 Поточна серія'),
            React.createElement('div',{style:{fontSize:36,fontWeight:700,color:'var(--orange)'}},`${stats.streak} днів`)
          ),
          React.createElement('div',{style:{textAlign:'right'}},
            React.createElement('div',{className:'text-xs'},'Цього тижня'),
            React.createElement('div',{style:{fontSize:28,fontWeight:700,color:'var(--green)'}},`${stats.week}/4`)
          )
        )
      ),
      React.createElement('div',{style:{padding:'0 16px'}},
        React.createElement('div',{className:'ach-grid'},
          ACHIEVEMENTS.map(a=>{
            const ok=unlockedAch.includes(a.id);
            return React.createElement('div',{key:a.id,className:`ach-item${ok?' unlocked':''}`},
              React.createElement('div',{className:'ach-icon'},a.icon),
              React.createElement('div',{className:'ach-name'},a.name),
              React.createElement('div',{className:'ach-desc'},a.desc),
              ok&&React.createElement('div',{style:{marginTop:6,fontSize:10,color:'var(--gold)',fontWeight:600}},'✓ Розблоковано')
            );
          })
        )
      )
    )
  );
}
